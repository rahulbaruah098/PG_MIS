{% extends "base.html" %}
{% block content %}

<style>

  .cpg-wrap{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:clamp(12px,2.2vw,22px);

    --ink:#0f172a;
    --muted:#64748b;
    --line:rgba(15,23,42,.18);
    --line2:rgba(15,23,42,.12);
    --paper:#ffffff;
    --soft:#f8fafc;
    --soft2:#f7faf9;
    --accent:#0b4d3a;

    color:var(--ink);
    position:relative;
  }
  .cpg-wrap *{ box-sizing:border-box; }

  .cpg-shell{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 18px 34px -26px rgba(15,23,42,.35);
    position:relative;
  }

  /* Header */
  .cpg-head{
    padding:14px 16px 12px;
    background:
      radial-gradient(circle at 15% 20%, rgba(11,77,58,.10), transparent 55%),
      linear-gradient(135deg, rgba(240,253,244,.9), rgba(255,255,255,.92));
    border-bottom:1.5px solid var(--line2);
    position:relative;
  }
  .cpg-title{
    margin:0;
    font-weight:950;
    font-size:18px;
    text-align:center;
    letter-spacing:.2px;
    line-height:1.25;
    color:var(--ink);
  }
  .cpg-subtitle{
    margin:6px 0 0;
    text-align:center;
    font-size:12px;
    font-weight:800;
    color:rgba(15,23,42,.68);
  }

  /* Back button */
  .cpg-back{
    display:none;
    position:absolute;
    top:12px;
    left:12px;
    width:38px;
    height:38px;
    border-radius:12px;
    border:1px solid rgba(15,23,42,.14);
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 12px 20px -16px rgba(15,23,42,.38);
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:rgba(11,77,58,.98);
    user-select:none;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    z-index:2;
  }
  .cpg-back:hover{
    transform:translateX(-1px);
    box-shadow:0 16px 26px -18px rgba(15,23,42,.46);
    background:rgba(255,255,255,.98);
  }
  .cpg-back:active{ transform:scale(.98); }
  .cpg-back svg{ width:18px; height:18px; display:block; }

  .cpg-section{
    padding:16px;
    background:rgba(255,255,255,.96);
  }

  .cpg-card{
    border:1px solid rgba(15,23,42,.14);
    border-radius:16px;
    background:rgba(255,255,255,.94);
    overflow:hidden;
    box-shadow:0 14px 26px -22px rgba(15,23,42,.28);
  }

  .cpg-card-head{
    padding:14px;
    border-bottom:1px solid var(--line2);
    background:rgba(247,250,249,.66);
  }
  .cpg-card-title{
    margin:0;
    font-weight:950;
    font-size:13px;
    line-height:1.35;
    color:var(--ink);
  }
  .cpg-card-sub{
    margin:6px 0 0;
    font-size:12px;
    color:rgba(15,23,42,.62);
    font-weight:750;
    line-height:1.45;
  }
  .cpg-card-body{
    padding:14px;
  }

  /* Form */
  .cpg-form{
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:14px;
    align-items:end;
  }
  .cpg-col-4{ grid-column:span 4; }
  .cpg-col-12{ grid-column:span 12; }

  .cpg-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
  }
  .cpg-label{
    margin:0;
    font-size:12px;
    font-weight:900;
    color:var(--ink);
    line-height:1.25;
  }
  .cpg-input,
  .cpg-select{
    width:100%;
    min-width:0;
    min-height:44px;
    border:1px solid rgba(15,23,42,.16);
    border-radius:14px;
    padding:10px 12px;
    background:rgba(247,250,249,.78);
    font-weight:800;
    font-size:12px;
    line-height:1.35;
    outline:none;
    color:var(--ink);
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .cpg-input:focus,
  .cpg-select:focus{
    border-color:rgba(11,77,58,.40);
    box-shadow:0 0 0 3px rgba(11,77,58,.10);
    background:#fff;
  }

  .cpg-help{
    margin:2px 0 0;
    font-size:12px;
    line-height:1.45;
    font-weight:700;
    color:var(--muted);
  }

  .cpg-btn{
    border:1px solid rgba(16,185,129,.35);
    background:rgba(16,185,129,.12);
    color:#0b4d3a;
    border-radius:999px;
    padding:10px 16px;
    font-weight:950;
    font-size:12px;
    cursor:pointer;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    text-decoration:none;
    white-space:nowrap;
  }
  .cpg-btn:hover{
    transform:translateY(-1px);
    background:rgba(16,185,129,.16);
    box-shadow:0 16px 22px -18px rgba(15,23,42,.25);
  }

  /* Tablet */
  @media (max-width: 900px){
    .cpg-wrap{
      padding:12px;
    }
    .cpg-form{
      grid-template-columns:repeat(6,minmax(0,1fr));
    }
    .cpg-col-4{ grid-column:span 3; }
    .cpg-col-12{ grid-column:span 6; }
  }

  /* Mobile / app */
  @media (max-width: 720px){
    .cpg-wrap{
      padding:10px;
    }
    .cpg-back{ display:flex; }

    .cpg-head{
      padding:14px 14px 12px;
    }
    .cpg-title{
      text-align:left;
      padding-left:52px;
      padding-right:8px;
      font-size:16px;
      min-height:38px;
      display:flex;
      align-items:center;
    }
    .cpg-subtitle{
      text-align:left;
      padding-left:52px;
      padding-right:8px;
    }

    .cpg-section{
      padding:14px;
    }
    .cpg-card-head,
    .cpg-card-body{
      padding:12px;
    }

    .cpg-form{
      grid-template-columns:1fr;
      gap:12px;
    }
    .cpg-col-4,
    .cpg-col-12{
      grid-column:1 / -1 !important;
    }
  }

  @media (max-width: 460px){
    .cpg-title{
      font-size:15px;
      line-height:1.3;
    }
    .cpg-card-title{
      font-size:12.5px;
    }
  }
</style>

<div class="cpg-wrap">
  <div class="cpg-shell">

    <div class="cpg-head">
      <a class="cpg-back" href="javascript:history.back()" aria-label="Go Back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 12H5M5 12l6 6M5 12l6-6"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"></path>
        </svg>
      </a>

      <h2 class="cpg-title">{{ title or 'Create PG Login' }}</h2>
      <div class="cpg-subtitle">Create a PG login and assign it to an existing PG</div>
    </div>

    <div class="cpg-section">
      <div class="cpg-card">
        <div class="cpg-card-head">
          <h3 class="cpg-card-title">PG Login Details</h3>
          <p class="cpg-card-sub">Enter the login details and map the account to a PG available in Master Data.</p>
        </div>

        <div class="cpg-card-body">
          <form method="post" class="cpg-form">
            <div class="cpg-col-4 cpg-field">
              <label class="cpg-label">Username</label>
              <input name="username" class="cpg-input" required>
            </div>

            <div class="cpg-col-4 cpg-field">
              <label class="cpg-label">Password</label>
              <input name="password" type="password" class="cpg-input" required>
            </div>

            <div class="cpg-col-4 cpg-field">
              <label class="cpg-label">PG</label>
              <select name="pg_id" class="cpg-select" required>
                {% for pg in pgs %}
                  <option value="{{ pg._id|string }}">{{ pg.name }}</option>
                {% endfor %}
              </select>
              <div class="cpg-help">PG must exist in Master Data.</div>
            </div>

            <div class="cpg-col-12 cpg-field" style="justify-content:end;">
              <button class="cpg-btn" type="submit">Create</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

{% endblock %}
