{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
  <h4 class="mb-0">CLFs</h4>
  <span class="badge bg-secondary">Block scope</span>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form method="post" class="row g-2">
      <div class="col-md-8">
        <input class="form-control" name="name" placeholder="CLF name" required>
      </div>
      <div class="col-md-4">
        <button class="btn btn-primary w-100" type="submit">Add CLF</button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table table-striped mb-0">
      <thead>
        <tr>
          <th style="width: 60px;">#</th>
          <th>CLF Name</th>
        </tr>
      </thead>
      <tbody>
        {% for c in clfs %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ c.name }}</td>
          </tr>
        {% else %}
          <tr><td colspan="2" class="text-muted p-3">No CLFs yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
