{% extends "base.html" %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
  /* ============================================================
     PG REGISTRATION (SCOPED) — keep ALL data + logic same
     ✅ ONLY UI/Design/Coloring updated to match Ledger Book style
     ✅ No changes to ids/names/inputs/data bindings/JS logic
     ============================================================ */

  .pgr-wrap{
    width: 100%;
    padding: clamp(12px, 2.2vw, 22px);
    max-width: 1100px;
    margin: 0 auto;

    --ink:#0f172a;
    --muted:#64748b;

    --line: rgba(15,23,42,.18);
    --line2: rgba(15,23,42,.12);

    --paper:#ffffff;
    --soft:#f7faf9;

    --accent:#0b4d3a;
    color: var(--ink);
  }
  .pgr-wrap *{ box-sizing:border-box; }

  /* ======= Sheet / Card like Ledger Book ======= */
  .pgr-hero,
  .pgr-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 34px -26px rgba(15,23,42,.35);
  }

  /* ======= Header like lb-head ======= */
  .pgr-hero{
    padding: 14px 16px 12px;
    background:
      radial-gradient(circle at 15% 20%, rgba(11,77,58,.10), transparent 55%),
      linear-gradient(135deg, rgba(240,253,244,.9), rgba(255,255,255,.92));
    border-bottom: 1.5px solid var(--line2);
    position: relative;
  }

  .pgr-hero-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pgr-title{
    display:flex;
    align-items:center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }

  .pgr-icon{
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(16,185,129,.22);
    background: rgba(16,185,129,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    flex: 0 0 auto;
  }
  .pgr-icon svg{ width: 20px; height: 20px; color: var(--accent); }

  .pgr-hgroup{ min-width:0; }

  .pgr-h1{
    margin:0;
    font-weight: 950;
    font-size: 18px;
    letter-spacing: .2px;
    line-height: 1.15;
    overflow-wrap: anywhere;
    color: var(--ink);
  }

  .pgr-sub{
    margin-top: 3px;
    font-size: 12px;
    font-weight: 850;
    color: rgba(15,23,42,.70);
  }

  .pgr-status{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(15,23,42,.12);
    background: rgba(247,250,249,.60);
    font-weight: 950;
    font-size: 12px;
    user-select:none;
    white-space:nowrap;
    color: rgba(15,23,42,.80);
  }
  .pgr-dot{
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: rgba(11,77,58,.90);
    box-shadow: 0 0 0 6px rgba(16,185,129,.12);
  }

  /* ======= Inner section (like lb-actions-bar separators) ======= */
  .pgr-card{
    margin-top: 12px;
    padding: 0; /* we will pad sections inside */
  }

  .pgr-card form{
    padding: 12px 16px 16px;
  }

  .pgr-section{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 0 12px;
    margin: 0;
    border-bottom: 1.5px solid var(--line2);
  }
  .pgr-section svg{
    width: 18px;
    height: 18px;
    color: rgba(11,77,58,.95);
  }
  .pgr-section-title{
    margin:0;
    font-size: 12px;
    font-weight: 950;
    color: rgba(15,23,42,.78);
    letter-spacing: .2px;
    text-transform: uppercase;
  }

  /* ======= Grid ======= */
  .pgr-grid{
    padding-top: 12px;
    display:grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 10px 14px;
  }

  .pgr-field{
    display:flex;
    flex-direction: column;
    gap: 6px;
    min-width:0;
  }

  .pgr-label{
    font-weight: 900;
    font-size: 12px;
    color: rgba(15,23,42,.78);
    letter-spacing: .2px;
    white-space: nowrap;
  }

  .pgr-input,
  .pgr-select{
    width:100%;
    border: 1px solid rgba(15,23,42,.16);
    border-radius: 12px;
    padding: 10px 12px;
    background: rgba(247,250,249,.75);
    font-weight: 800;
    font-size: 12px;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    color: var(--ink);
  }

  .pgr-input:focus,
  .pgr-select:focus{
    border-color: rgba(11,77,58,.40);
    box-shadow: 0 0 0 3px rgba(11,77,58,.10);
    background: #fff;
  }

  .pgr-input[readonly]{
    background: transparent;
    border-color: rgba(15,23,42,.12);
    color: rgba(15,23,42,.92);
  }

  .pgr-hr{
    height: 1px;
    border: none;
    background: var(--line2);
    margin: 6px 0 2px;
  }

  /* spans */
  .col-12{grid-column:span 12;}
  .col-9{grid-column:span 9;}
  .col-8{grid-column:span 8;}
  .col-6{grid-column:span 6;}
  .col-4{grid-column:span 4;}
  .col-3{grid-column:span 3;}

  .pgr-help{
    font-size: 12px;
    color: rgba(15,23,42,.60);
    font-weight: 800;
    margin-top: 2px;
  }

  /* ======= Preview card -> ledger-ish ======= */
  .pgr-preview{
    border-radius: 16px;
    border: 1px solid var(--line);
    overflow:hidden;
    background: #fff;
    box-shadow: 0 18px 34px -26px rgba(15,23,42,.35);
  }

  .pgr-preview-head{
    padding: 10px 12px;
    background:
      radial-gradient(circle at 20% 20%, rgba(16,185,129,.12), transparent 55%),
      linear-gradient(to right, rgba(5,150,105,.10), rgba(16,185,129,.10));
    border-bottom: 1px solid rgba(15,23,42,.08);
    font-weight: 950;
    color:#0b4d3a;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
  }

  .pgr-count{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid rgba(15,23,42,.12);
    border-radius: 999px;
    background: rgba(247,250,249,.55);
    font-weight: 950;
    font-size: 12px;
    color: rgba(15,23,42,.80);
  }

  .pgr-preview-body{
    padding: 12px;
  }

  /* Keep your cleanup rules for member preview (old/new injections) */
  #memberPreview{
    display: grid;
    gap: 10px;
  }

  #memberPreview > .border.rounded{
    border: 1px solid rgba(15,23,42,0.10) !important;
    border-radius: 14px !important;
    padding: 10px 12px !important;
    background: #ffffff !important;
    box-shadow: 0 10px 18px -16px rgba(0,0,0,0.35);
  }

  #memberPreview > .border.rounded.d-flex{
    align-items: center !important;
    gap: 12px !important;
  }

  #memberPreview > .border.rounded > div:first-child{
    font-weight: 850;
    color: #0f172a;
    line-height: 1.25;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #memberPreview .remove-member.btn,
  #memberPreview .remove-member{
    appearance: none;
    border: 1px solid rgba(239,68,68,0.25) !important;
    background: rgba(239,68,68,0.10) !important;
    color: #991b1b !important;
    font-weight: 950 !important;
    border-radius: 9999px !important;
    padding: 8px 12px !important;
    font-size: 12.5px !important;
    line-height: 1 !important;
    box-shadow: none !important;
    white-space: nowrap;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  #memberPreview .remove-member:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 22px -18px rgba(0,0,0,0.35);
  }

  /* Your chosen member row UI stays (just make it match ledger skin) */
  .pgr-member-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(15,23,42,.14);
    box-shadow: 0 14px 22px -22px rgba(15,23,42,.22);
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .pgr-member-row:hover{
    transform: translateY(-1px);
    box-shadow: 0 18px 28px -24px rgba(15,23,42,.28);
    background: #fff;
  }
  .pgr-member-name{
    font-weight: 850;
    color: var(--ink);
    font-size: 12.5px;
    min-width:0;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pgr-member-actions{
    display:flex;
    gap: 8px;
    flex: 0 0 auto;
  }
  .pgr-icon-btn{
    border: 1px solid rgba(15,23,42,.14);
    background: rgba(247,250,249,.75);
    width: 38px;
    height: 34px;
    border-radius: 12px;
    cursor:pointer;
    font-size: 14px;
    font-weight: 950;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
    user-select:none;
    color: rgba(15,23,42,.85);
  }
  .pgr-icon-btn:hover{
    transform: translateY(-1px);
    background: #fff;
    box-shadow: 0 16px 22px -18px rgba(15,23,42,.20);
  }
  .pgr-icon-btn.edit-member:hover{
    border-color: rgba(2,132,199,.22);
    background: rgba(2,132,199,.10);
    color: rgba(2,132,199,.95);
  }
  .pgr-icon-btn.remove-member:hover{
    border-color: rgba(239,68,68,.28);
    background: rgba(239,68,68,.10);
    color: rgba(127,29,29,.95);
  }

  .pgr-empty,
  #memberPreview .text-muted.small{
    padding: 8px 2px;
    color: rgba(15,23,42,.55) !important;
    font-weight: 800;
    font-size: 12px;
  }

  /* ======= Actions (Save button like lb-btn primary) ======= */
  .pgr-actions{
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1.5px solid var(--line2);
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pgr-btn{
    border: 1px solid rgba(15,23,42,.14);
    background: rgba(247,250,249,.8);
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 14px;
    font-weight: 950;
    font-size: 12px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
    display:inline-flex;
    align-items:center;
    gap: 8px;
    user-select: none;
    white-space: nowrap;
    min-height: 44px;
  }
  .pgr-btn:hover{
    transform: translateY(-1px);
    background: #fff;
    box-shadow: 0 16px 22px -18px rgba(15,23,42,.25);
  }

  .pgr-btn-primary{
    border-color: rgba(16,185,129,.35);
    background: rgba(16,185,129,.12);
    color:#0b4d3a;
  }
  .pgr-btn-primary:hover{
    background: rgba(16,185,129,.16);
  }

  /* ======= Select2 (match ledger inputs) ======= */
  .pgr-card .select2-container{ width:100% !important; }

  .pgr-card .select2-container--default .select2-selection--multiple{
    min-height: 46px;
    border-radius: 12px;
    border: 1px solid rgba(15,23,42,.16);
    background: rgba(247,250,249,.75);
    padding: 6px 10px;
  }
  .pgr-card .select2-container--default.select2-container--focus .select2-selection--multiple{
    border-color: rgba(11,77,58,.40);
    box-shadow: 0 0 0 3px rgba(11,77,58,.10);
    background: #fff;
  }
  .pgr-card .select2-container--default .select2-selection--multiple .select2-selection__rendered{
    padding-left: .1rem;
  }
  .pgr-card .select2-container--default .select2-selection__choice{
    background: rgba(16,185,129,.12);
    border: 1px solid rgba(16,185,129,.30);
    color: #0b4d3a;
    border-radius: 9999px;
    padding: .25rem .55rem;
    font-weight: 900;
    margin-top: .35rem;
  }
  .pgr-card .select2-container--default .select2-selection__choice__remove{
    color: #0b4d3a;
    margin-right: .35rem;
  }
  .pgr-card .select2-dropdown{
    border-radius: 14px;
    border: 1px solid rgba(15,23,42,.10);
    overflow:hidden;
    box-shadow: 0 22px 44px -30px rgba(0,0,0,.35);
  }
  .pgr-card .select2-container--default .select2-search--inline .select2-search__field{
    font-weight: 800;
    font-size: 12px;
  }
  .pgr-card .select2-container--default .select2-results__option--highlighted.select2-results__option--selectable{
    background: rgba(16,185,129,.12);
    color: #0b4d3a;
    font-weight: 900;
  }

  /* ======= Responsive like ledger ======= */
  @media(max-width:768px){
    .col-4,.col-3,.col-6,.col-8,.col-9{grid-column:span 12;}
    .pgr-card form{ padding: 12px; }
    .pgr-hero{ padding: 14px 12px 12px; }
  }
  @media(max-width:420px){
    .pgr-status{ font-size:12px; padding:8px 10px; }
  }
</style>

<div class="pgr-wrap">

  <!-- HERO (same data, new ledger-like skin) -->
  <div class="pgr-hero">
    <div class="pgr-hero-top">
      <div class="pgr-title">
        <div class="pgr-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 20V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12" stroke="currentColor" stroke-width="2"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="2"/>
            <path d="M7 20v-8h10v8" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="pgr-hgroup">
          <div class="pgr-h1">PG Registration – {{ pg.name }}</div>
          <div class="pgr-sub">Location, bank, aggregation & member selection</div>
        </div>
      </div>

      <div class="pgr-status">
        <span class="pgr-dot"></span>
        Status: {{ pg.status or 'draft' }}
      </div>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="pgr-card">
    <form method="POST">
      <div class="pgr-section">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h3 class="pgr-section-title">Registration Details</h3>
      </div>

      <div class="pgr-grid">
        <!-- LOCATION -->
        <div class="pgr-field col-4">
          <label class="pgr-label">State</label>
          <input type="text" class="pgr-input" value="{{ pg.State }}" readonly>
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">District</label>
          <input type="text" class="pgr-input" value="{{ pg.District }}" readonly>
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Block</label>
          <input type="text" class="pgr-input" value="{{ pg.Block }}" readonly>
        </div>

        <div class="pgr-field col-6">
          <label class="pgr-label">Gram Panchayat</label>
          <input type="text" class="pgr-input" value="{{ pg['Gram Panchayat'] }}" readonly>
        </div>

        <div class="pgr-field col-6">
          <label class="pgr-label">Village</label>
          <input type="text" class="pgr-input" value="{{ pg.Village }}" readonly>
        </div>

        <div class="col-12"><hr class="pgr-hr"></div>

        <!-- BASIC INFO -->
        <div class="pgr-field col-4">
          <label class="pgr-label">PG Type</label>
          <input type="text" class="pgr-input" name="pg_type" value="{{ pg.pg_type or '' }}">
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Sector</label>
          <input type="text" class="pgr-input" name="sector" value="{{ pg.sector or '' }}">
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Formation Date</label>
          <input type="date" class="pgr-input" name="formation_date" value="{{ pg.formation_date or '' }}">
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Contact Number</label>
          <input type="text" class="pgr-input" name="contact_number"
                 value="{{ pg.office_bearers.contact_number if pg.office_bearers else '' }}">
        </div>

        <div class="col-12"><hr class="pgr-hr"></div>

        <!-- BANK -->
        <div class="pgr-field col-3">
          <label class="pgr-label">Bank Name</label>
          <input type="text" class="pgr-input" name="bank_name"
                 value="{{ pg.bank_details.bank_name if pg.bank_details else '' }}">
        </div>

        <div class="pgr-field col-3">
          <label class="pgr-label">Branch</label>
          <input type="text" class="pgr-input" name="branch"
                 value="{{ pg.bank_details.branch if pg.bank_details else '' }}">
        </div>

        <div class="pgr-field col-3">
          <label class="pgr-label">Account Number</label>
          <input type="text" class="pgr-input" name="account_number"
                 value="{{ pg.bank_details.account_number if pg.bank_details else '' }}">
        </div>

        <div class="pgr-field col-3">
          <label class="pgr-label">IFSC</label>
          <input type="text" class="pgr-input" name="ifsc"
                 value="{{ pg.bank_details.ifsc if pg.bank_details else '' }}">
        </div>

        <div class="col-12"><hr class="pgr-hr"></div>

        <!-- AGGREGATION -->
        <div class="pgr-field col-6">
          <label class="pgr-label">Aggregation Centre Name</label>
          <input type="text" class="pgr-input" name="agg_centre_name"
                 value="{{ pg.aggregation_centre.name if pg.aggregation_centre else '' }}">
        </div>

        <div class="pgr-field col-6">
          <label class="pgr-label">Aggregation Centre Address</label>
          <input type="text" class="pgr-input" name="agg_centre_address"
                 value="{{ pg.aggregation_centre.address if pg.aggregation_centre else '' }}">
        </div>

        <div class="col-12"><hr class="pgr-hr"></div>

        <!-- MEMBERS -->
        <div class="pgr-field col-12">
          <label class="pgr-label" style="font-size:12px;">Add PG Members</label>
          <select id="memberSelect" class="pgr-select" multiple>
            {% for m in shg_members %}
              <option value="{{ m._id }}">
                {{ m["Member Name"] }} | {{ m["SHG Name"] }} | {{ m["SHG Code"] }}
              </option>
            {% endfor %}
          </select>
          <div class="pgr-help">Maximum 40 members allowed.</div>
        </div>

        <!-- Preview -->
        <div class="col-12" style="margin-top:6px;">
          <div class="pgr-preview">
            <div class="pgr-preview-head">
              <span>Selected Members</span>
              <span class="pgr-count">Count: <span id="memberCount">0</span></span>
            </div>
            <div class="pgr-preview-body" id="memberPreview">
              <div class="pgr-empty">No members selected</div>
            </div>
          </div>
        </div>

        <div class="col-12"><hr class="pgr-hr"></div>

        <!-- Office Bearers -->
        <div class="pgr-field col-4">
          <label class="pgr-label">President</label>
          <select name="president_id" id="presidentSelect" class="pgr-select"></select>
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Secretary</label>
          <select name="secretary_id" id="secretarySelect" class="pgr-select"></select>
        </div>

        <div class="pgr-field col-4">
          <label class="pgr-label">Cashier</label>
          <select name="cashier_id" id="cashierSelect" class="pgr-select"></select>
        </div>

        <div class="pgr-field col-3">
          <label class="pgr-label">Total Members</label>
          <input type="number" id="totalMembers" name="total_members" class="pgr-input"
                 value="{{ pg.total_members or 0 }}" readonly>
        </div>

      </div>

      <div id="hiddenMemberInputs"></div>

      <div class="pgr-actions">
        <button class="pgr-btn pgr-btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>

</div>

<script id="existing-members-data" type="application/json">
{{ safe_members | tojson | safe }}
</script>
<script>
    const PG_MEMBERSHIP_URL_TEMPLATE = "{{ url_for('pg.pg_members', pg_id='__PGID__') }}";
</script>

<script>
$(document).ready(function() {

    // ===============================
    // Load existing members safely
    // ===============================
    let existingMembers = JSON.parse(
        document.getElementById("existing-members-data").textContent || "[]"
    );

    // ===============================
    // Initialize Select2
    // ===============================
    $('#memberSelect').select2({
        width: '100%',
        placeholder: "Search and select SHG members"
    });

    // ===============================
    // Refresh UI
    // ===============================
     function refreshUI(){

    let selected = $('#memberSelect').select2('data') || [];

    // 🔹 Max 40 validation
    if (selected.length > 40) {
        alert("Maximum 40 members allowed.");
        selected.pop();
        $('#memberSelect')
            .val(selected.map(x => x.id))
            .trigger('change');
        return;
    }

    let preview = $('#memberPreview');
    let hiddenContainer = $('#hiddenMemberInputs');

    preview.empty();
    hiddenContainer.empty();

    if (selected.length === 0) {
        preview.html('<div class="text-muted small">No members selected</div>');
    }

    selected.forEach(member => {

        // 🔹 Extract ONLY member name (before first "|")
        let memberName = member.text.split('|')[0].trim();

        preview.append(`
            <div class="pgr-member-row">

                <div class="pgr-member-name">
                    ${memberName}
                </div>

                <div class="pgr-member-actions">

                    <!-- Edit -->
                    <button type="button"
                            class="pgr-icon-btn edit-member"
                            data-id="${member.id}"
                            title="Edit Member">
                        ✏
                    </button>

                    <!-- Remove -->
                    <button type="button"
                            class="pgr-icon-btn remove-member"
                            data-id="${member.id}"
                            title="Remove Member">
                        ✕
                    </button>

                </div>
            </div>
        `);


        hiddenContainer.append(
            `<input type="hidden" name="member_ids[]" value="${member.id}">`
        );
    });

    $('#memberCount').text(selected.length);
    $('#totalMembers').val(selected.length);

    updateOfficeBearers(selected);
  }


    // ===============================
    // Update Office Bearers
    // ===============================
    function updateOfficeBearers(selected) {

        let p = $('#presidentSelect');
        let s = $('#secretarySelect');
        let c = $('#cashierSelect');

        let selectedIds = selected.map(m => String(m.id));

        // Store current selection before rebuilding
        let currentPresident = p.val();
        let currentSecretary = s.val();
        let currentCashier = c.val();

        p.empty();
        s.empty();
        c.empty();

        selected.forEach(member => {
            let option = `<option value="${member.id}">${member.text}</option>`;
            p.append(option);
            s.append(option);
            c.append(option);
        });

        // Restore previous values if still valid
        if (selectedIds.includes(currentPresident)) p.val(currentPresident);
        if (selectedIds.includes(currentSecretary)) s.val(currentSecretary);
        if (selectedIds.includes(currentCashier)) c.val(currentCashier);

        // First load (edit mode only)
        if (existingMembers.length > 0) {
            existingMembers.forEach(m => {

                let id = String(m.member_id);

                if (!selectedIds.includes(id)) return;

                if (m.role === "president") p.val(id);
                if (m.role === "secretary") s.val(id);
                if (m.role === "cashier") c.val(id);
            });

            // Prevent re-running edit preload
            existingMembers = [];
        }
    }

    // ===============================
    // Remove Member
    // ===============================
    $(document).on('click', '.remove-member', function() {

        let id = String($(this).data('id'));

        let current = $('#memberSelect').val() || [];

        current = current.filter(v => v !== id);

        $('#memberSelect').val(current).trigger('change');
    });


    // ===============================
    // Edit Member
    // ===============================
    $(document).on('click', '.edit-member', function() {

    let memberId = $(this).data('id');

    let url = PG_MEMBERSHIP_URL_TEMPLATE.replace('__PGID__', PG_ID);

    window.location.href = `${url}?member_id=${memberId}`;
    });


    // ===============================
    // Select Change
    // ===============================
    $('#memberSelect').on('change', refreshUI);

    // ===============================
    // Preload Existing Members
    // ===============================
    if (existingMembers.length > 0) {

        let ids = existingMembers.map(m => String(m.member_id));

        $('#memberSelect')
            .val(ids)
            .trigger('change');

    } else {
        refreshUI();
    }

});
</script>

{% endblock %}
