<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PG MIS - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg1:#d9efe6;
    --bg2:#c6e6da;
    --mint:#d7f1e6;
    --mint-2:#eaf7f2;
    --card:#eef7f3;
    --line:#bfe8d7;
    --line-2:#a7dec8;
    --ink:#173b2c;
    --muted:#2a4a3d;
    --brand:#0d6f45;
    --brand-2:#0a5d3a;

    /* ✅ professional footer tone */
    --footerInk:#1f4b3a;
    --footerMuted:#3a6b59;

    --shadow:0 18px 34px rgba(6,40,26,.20);
    --shadow-soft:0 10px 22px rgba(6,40,26,.14);
    --r:22px;

    /* ✅ adapt bands + gaps to short height screens */
    --bandH: clamp(56px, 9.5svh, 120px);
    --gapTop: clamp(10px, 2.6svh, 40px);
    --gapBottom: clamp(10px, 2.6svh, 40px);

    --safeTop: env(safe-area-inset-top, 0px);
    --safeBottom: env(safe-area-inset-bottom, 0px);

    --vH: 1vh;

    /* ✅ Fit vars */
    --fit: 1;
  }

  @supports (height: 100dvh){ :root{ --vH: 1dvh; } }
  @supports (height: 100svh){ :root{ --vH: 1svh; } }

  *{ box-sizing:border-box }
  html,body{ height:100% }

  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
    overflow:hidden;

    background:
      radial-gradient(900px 560px at 18% 52%, rgba(13,111,69,.28) 0%, rgba(13,111,69,0) 62%),
      radial-gradient(900px 560px at 82% 52%, rgba(13,111,69,.26) 0%, rgba(13,111,69,0) 62%),
      radial-gradient(1100px 720px at 50% 42%, rgba(255,255,255,.72) 0%, rgba(255,255,255,0) 56%),
      linear-gradient(90deg, #bfe7d6 0%, #d7efe6 40%, #d7efe6 60%, #bfe7d6 100%);
    position:relative;
  }

  /* background pattern (FIXED: proper URL encoding for xmlns quotes) */
  body::before{
    content:"";
    position:fixed; inset:-2px;
    background-image:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%20viewBox%3D%270%200%20180%20180%27%3E%3Crect%20width%3D%27180%27%20height%3D%27180%27%20fill%3D%27none%27/%3E%3Cg%20opacity%3D%270.28%27%3E%3Cg%20fill%3D%27%2387cbb2%27%3E%3Cpath%20d%3D%27M20%2020l10%2010-10%2010-10-10z%27/%3E%3Cpath%20d%3D%27M80%2030l8%208-8%208-8-8z%27/%3E%3Cpath%20d%3D%27M140%2026l10%2010-10%2010-10-10z%27/%3E%3Cpath%20d%3D%27M52%2076l7%207-7%207-7-7z%27/%3E%3Cpath%20d%3D%27M112%2082l7%207-7%207-7-7z%27/%3E%3Cpath%20d%3D%27M160%2084l8%208-8%208-8-8z%27/%3E%3Cpath%20d%3D%27M26%20128l9%209-9%209-9-9z%27/%3E%3Cpath%20d%3D%27M84%20136l7%207-7%207-7-7z%27/%3E%3Cpath%20d%3D%27M140%20140l10%2010-10%2010-10-10z%27/%3E%3C/g%3E%3Cg%20fill%3D%27%239ad5c0%27%3E%3Ccircle%20cx%3D%2740%27%20cy%3D%2744%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2798%27%20cy%3D%2754%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%27160%27%20cy%3D%2740%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2792%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2772%27%20cy%3D%2798%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%27132%27%20cy%3D%27106%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%27166%27%20cy%3D%27118%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%2752%27%20cy%3D%27156%27%20r%3D%272%27/%3E%3Ccircle%20cx%3D%27110%27%20cy%3D%27160%27%20r%3D%272%27/%3E%3C/g%3E%3Cg%20stroke%3D%27%2387cbb2%27%20stroke-width%3D%271%27%20fill%3D%27none%27%20opacity%3D%270.35%27%3E%3Cpath%20d%3D%27M30%2016c8%2010%208%2026%200%2036-8-10-8-26%200-36z%27/%3E%3Cpath%20d%3D%27M24%20116c10%200%2018%208%2018%2018s-8%2018-18%2018-18-8-18-18%208-18%2018-18z%27/%3E%3Cpath%20d%3D%27M156%2060c10%200%2018%208%2018%2018s-8%2018-18%2018-18-8-18-18%208-18%2018-18z%27/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    background-size:180px 180px;
    background-repeat:repeat;
    filter:saturate(1.05);
    pointer-events:none;
    z-index:0;
  }

  /* bands */
  .top-band,
  .bottom-band{
    position:fixed;
    left:0; right:0;
    height:var(--bandH);
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .top-band{ top:0; }
  .bottom-band{
    bottom:0;
    transform:scaleY(-1);
    margin-bottom: calc(var(--safeBottom) * -1);
  }

  .band-svg{ display:none; width:100%; height:100%; }
  .band-svg.is-desktop{ display:block; }
  .band-svg.is-mobile{ display:none; }

  /* ✅ Stage between bands (true centering) */
  .stage{
    min-height: calc(var(--vH) * 100);
    height: calc(var(--vH) * 100);
    padding-top: calc(var(--bandH) + var(--gapTop) + var(--safeTop));
    padding-bottom: calc(var(--bandH) + var(--gapBottom) + var(--safeBottom));
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:2;
    overflow:hidden;
  }

  .fit-wrap{
    transform: scale(var(--fit));
    transform-origin: center;
    will-change: transform;
    width:100%;
    display:flex;
    justify-content:center;
  }

  /* main wrap */
  .wrap{
    width:min(980px, 92vw);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    position:relative;
    z-index:2;
  }

  /* =========================================================
     Animations (different styles)
     ========================================================= */

  /* Header/text reveal */
  @keyframes textReveal{
    0%{ opacity:0; transform: translateY(10px); filter: blur(3px); }
    60%{ opacity:1; filter: blur(0.5px); }
    100%{ opacity:1; transform: translateY(0); filter: blur(0); }
  }
  .reveal-text{ opacity:0; animation: textReveal 1.05s cubic-bezier(.2,.9,.2,1) forwards; }

  /* Card reveal */
  @keyframes cardReveal{
    0%{ opacity:0; transform: translateY(18px) scale(.985); filter: blur(2px); }
    100%{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .reveal-card{ opacity:0; animation: cardReveal 1.15s cubic-bezier(.2,.9,.2,1) forwards; }

  /* Field stagger */
  @keyframes fieldReveal{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .reveal-field{ opacity:0; animation: fieldReveal .85s cubic-bezier(.2,.9,.2,1) forwards; }

  /* Footer reveal */
  @keyframes footerReveal{
    from{ opacity:0; transform: translateY(8px); letter-spacing:.6px; }
    to{ opacity:1; transform: translateY(0); letter-spacing:.1px; }
  }
  .reveal-footer{ opacity:0; animation: footerReveal 1s cubic-bezier(.2,.9,.2,1) forwards; }

  /* delays */
  .d-1{ animation-delay:.10s; }
  .d-2{ animation-delay:.28s; }
  .d-3{ animation-delay:.52s; }
  .d-4{ animation-delay:.76s; }
  .d-5{ animation-delay:.96s; }
  .d-6{ animation-delay:1.10s; }

  /* Header */
  .header{ text-align:center; margin-bottom:10px; }
  .header h1{
    margin:0;
    font-family:"Playfair Display", serif;
    font-weight:800;
    letter-spacing:.5px;
    font-size: clamp(34px, 6.2vmin, 66px);
    color:var(--brand);
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    display:inline-block;
    padding:8px 24px;
  }
  .subline{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    font-weight:600;
    font-size: clamp(12px, 1.7vmin, 16px);
    flex-wrap:wrap;
  }
  .subline .as{ font-weight:700; }

  /* ==========================
     ✅ TOP-RIGHT TOAST FLASHES
     ========================== */
  .flash-wrap{
    position:fixed;
    top: calc(var(--bandH) + 12px + var(--safeTop));
    right: 14px;
    width: min(380px, calc(100vw - 28px));
    z-index: 50;
    display:flex;
    flex-direction:column;
    gap:10px;
    pointer-events:none; /* only alerts receive clicks */
  }

  .alert{
    border-radius:16px;
    padding:12px 14px;
    font-weight:700;
    box-shadow: var(--shadow-soft);
    border: 1px solid rgba(112,214,180,.55);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    pointer-events:auto;
    position:relative;
    overflow:hidden;
    animation: toastIn .35s cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes toastIn{
    from{ opacity:0; transform: translateY(-10px) scale(.98); filter: blur(1px); }
    to{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .alert-success{ border-color: rgba(13,111,69,.32); }
  .alert-danger{ border-color: rgba(160,20,20,.26); }
  .alert-warning{ border-color: rgba(180,120,10,.26); }
  .alert-info{ border-color: rgba(20,90,160,.26); }
  .alert-warning, .alert-danger, .alert-success, .alert-info{ color:#1e3a2f; }

  .alert-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .btn-close{
    border:none;
    background:transparent;
    cursor:pointer;
    width:34px;
    height:34px;
    border-radius: 12px;
    display:grid;
    place-items:center;
    opacity:.85;
    flex: 0 0 auto;
  }
  .btn-close:hover{ opacity:1; background: rgba(13,111,69,.08); }
  .btn-close::before{
    content:"✕";
    font-size:16px;
    line-height:1;
    color:#23443a;
    font-weight:900;
  }

  /* auto-dismiss animation */
  .alert.is-leaving{
    animation: toastOut .32s ease forwards;
  }
  @keyframes toastOut{
    to{ opacity:0; transform: translateY(-8px) scale(.98); max-height:0; margin:0; padding-top:0; padding-bottom:0; }
  }

  /* Card */
  .card{
    width:min(520px, 92vw);
    background: linear-gradient(#f2faf6, #eef7f3);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: 44px 34px 42px;
    transition: transform .18s ease, box-shadow .18s ease;
    will-change: transform;
  }
  .card:hover{
    transform: scale(1.012);
    box-shadow: 0 22px 40px rgba(6,40,26,.22);
  }

  form{ margin:0; width:100%; }
  .field{ margin: 16px 6px 26px; width:100%; }
  .label{
    font-weight:800;
    color:#243c32;
    margin: 0 0 12px;
    font-size:15px;
  }

  .input{
    width:100%;
    height:54px;
    border-radius:14px;
    border:2px solid rgba(112,214,180,.55);
    background:#ffffff;
    padding: 12px 16px;
    outline:none;
    font-size:15px;
    color:#213a30;
    transition:.15s ease;
    box-shadow: 0 8px 18px rgba(6,40,26,.06);
    opacity: .45;
  }
  .input:focus{
    border-color: rgba(13,111,69,.60);
    box-shadow: 0 12px 24px rgba(6,40,26,.12);
  }

  .pw{ position:relative; }
  .eye-btn{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:transparent;
    padding:6px;
    cursor:pointer;
    opacity:.85;
  }
  .eye-btn:hover{ opacity:1 }
  .eye{ width:20px; height:20px; }
  .eye path, .eye circle{
    stroke:#5d6f67;
    stroke-width:1.8;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* Button */
  .btn{
    margin: 14px 6px 0;
    width:calc(100% - 12px);
    height:64px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    color:#fff;
    font-weight:800;
    font-size:18px;
    letter-spacing:.2px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(180deg, #0f7a4b 0%, #0b5f3a 100%);
    box-shadow: 0 14px 22px rgba(6,40,26,.18);
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    will-change: transform;
  }
  .btn:hover{
    filter: brightness(1.02);
    box-shadow: 0 18px 28px rgba(6,40,26,.20);
    transform: scale(1.02);
  }
  .btn:active{
    transform: scale(1.01);
    box-shadow: 0 12px 18px rgba(6,40,26,.16);
  }
  .btn:focus-visible{
    outline: 3px solid rgba(13,111,69,.28);
    outline-offset: 3px;
  }

  /* ✅ Powered by (professional) */
  .powered-link{
    margin-top: 6px;
    text-align:center;
  }
  .powered-link a{
    text-decoration:none;
    color: var(--footerMuted);
    font-weight:700;
    font-size:14px;
    letter-spacing:.12px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(13,111,69,.18);
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 18px rgba(6,40,26,.10);
    transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    will-change: transform;
  }
  .powered-link a strong{
    color: var(--footerInk);
    font-weight:800;
  }
  .powered-link a:hover{
    transform: translateY(-1px);
    box-shadow: 0 14px 22px rgba(6,40,26,.12);
    opacity:.98;
  }

  /* ✅ MOBILE */
  @media (max-width:720px){
    .band-svg.is-desktop{ display:none; }
    .band-svg.is-mobile{ display:block; }
    .card{ width:min(480px, 92vw); padding: 34px 18px 32px; }
    .wrap{ gap:14px; }
    .flash-wrap{
      top: calc(var(--bandH) + 10px + var(--safeTop));
      right: 10px;
      width: min(360px, calc(100vw - 20px));
    }
  }

  @media (max-width:420px){
    .card{ width:92vw; padding: 30px 16px 28px; border-radius:18px; }
    .field{ margin: 14px 4px 22px; }
    .input{ height:50px; font-size:14px; }
    .btn{ height:60px; font-size:17px; }
  }

  @media (prefers-reduced-motion: reduce){
    .reveal-text, .reveal-card, .reveal-field, .reveal-footer{ animation:none !important; opacity:1 !important; transform:none !important; filter:none !important; }
    .btn, .powered-link a, .card{ transition:none; }
    .alert{ animation:none; }
  }
</style>
</head>

      <defs>
        <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#d7f1e6"/>
          <stop offset="1" stop-color="#cfeadd"/>
        </linearGradient>
        <pattern id="motif2" width="140" height="120" patternUnits="userSpaceOnUse">
          <g opacity="0.18">
            <polygon points="70,10 92,32 70,54 48,32" fill="none" stroke="#86cbb3" stroke-width="2"/>
          </g>

  <!-- ✅ Flash Messages moved here so they can be fixed top-right -->
  <div class="flash-wrap" aria-label="Flash Messages" id="flashWrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }}" role="alert" data-alert>
            <div class="alert-row">
              <div>{{ msg }}</div>
              <button type="button" class="btn-close" aria-label="Close"></button>

      {% endif %}

  <!-- Stage + Fit -->
  <div class="stage" id="stage">
    <div class="fit-wrap" id="fitWrap">
      <main class="wrap" id="wrap">

        <!-- text reveal -->
        <header class="header reveal-text d-1" aria-label="Login Header">
          <h1>PG MIS Login</h1>
          <div class="subline reveal-text d-2">
            <span class="as">ত্রিপুরা -</span>
            <span>Tripura's Digital Gateway</span>
          </div>
        </header>

        <!-- slow form reveal + stagger fields -->
        <section class="card reveal-card d-3" aria-label="Login Card">
          <form method="POST" autocomplete="on">
            <div class="field reveal-field d-4">
              <div class="label">Username</div>
              <input class="input" type="text" name="username" placeholder="username" required>
            </div>

            <div class="field reveal-field d-5">
              <div class="label">Password</div>
              <div class="pw">
                <input class="input" type="password" name="password" id="password" placeholder="password" required>
                <button class="eye-btn" type="button" id="togglePw" aria-label="Show password">
                  <svg class="eye" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"></path>
                    <circle cx="12" cy="12" r="2.7"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn reveal-field d-6">
              <span>Login</span>
            </button>
          </form>
        </section>

        <!-- footer reveal -->
        <div class="powered-link reveal-footer d-6" aria-label="Powered by">
          <a href="https://sayanant.com/" target="_blank" rel="noopener noreferrer">
            Powered by <strong>Sayanant Group</strong>
          </a>
        </div>

      </main>

<script>
(function(){
  // password toggle
  const btn = document.getElementById('togglePw');
  const input = document.getElementById('password');
  if(btn && input){
    btn.addEventListener('click', () => {
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
    });
  }

  // helpers
  const root = document.documentElement;
  const wrap = document.getElementById('wrap');
  const stage = document.getElementById('stage');
  const flashWrap = document.getElementById('flashWrap');

  function px(n){ return Number(String(n || "0").replace("px","")) || 0; }

  // ✅ Fit system (scale-only; stays centered)
  function fit(){
    if(!wrap || !stage) return;

    root.style.setProperty('--fit', '1');

    const cs = getComputedStyle(stage);
    const padTop = px(cs.paddingTop);
    const padBot = px(cs.paddingBottom);

    const usable = Math.max(0, stage.clientHeight - padTop - padBot);
    const needed = wrap.scrollHeight;

    if(!usable || !needed) return;

    const margin = 8;
    let scale = (usable - margin) / needed;
    scale = Math.min(1, scale);
    scale = Math.max(0.72, scale);

    root.style.setProperty('--fit', String(scale));
  }

  window.addEventListener('load', () => { fit(); setTimeout(fit, 120); setTimeout(fit, 420); });
  window.addEventListener('resize', () => { fit(); setTimeout(fit, 120); });

  // ✅ dismiss flash alerts + auto-dismiss
  function dismissAlert(alertEl){
    if(!alertEl || alertEl.classList.contains('is-leaving')) return;
    alertEl.classList.add('is-leaving');
    setTimeout(() => { alertEl.remove(); fit(); }, 340);
  }

  // click-to-close
  document.addEventListener('click', (e) => {
    const closeBtn = e.target && e.target.closest && e.target.closest('.btn-close');
    if(!closeBtn) return;
    const alert = closeBtn.closest('[data-alert]');
    dismissAlert(alert);
  });

  // auto-dismiss all flashes
  function initAutoDismiss(){
    if(!flashWrap) return;
    const alerts = Array.from(flashWrap.querySelectorAll('[data-alert]'));
    alerts.forEach((a, idx) => {
      // slight stagger so multiple messages don't vanish exactly together
      const delay = 2600 + (idx * 350);
      setTimeout(() => dismissAlert(a), delay);
    });
  }

  // if flashes change, re-init + refit
  if(flashWrap){
    const mo = new MutationObserver(() => { initAutoDismiss(); fit(); });
    mo.observe(flashWrap, { childList:true, subtree:true });
  }

  initAutoDismiss();
})();
</script>
