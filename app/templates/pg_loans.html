{% extends "base.html" %}
{% block content %}

<style>
/* ============================================================
   PG LOAN PAGE — SCOPED STYLING (MATCHES DASHBOARD THEME)
============================================================ */

.loan-wrap{
  width:100%;
  max-width:1100px;
  margin:0 auto;
}

/* ---------- HERO ---------- */
.loan-hero{
  background: linear-gradient(to right,#059669,#10b981);
  border-radius:1.25rem;
  padding:1.25rem;
  color:#fff;
  box-shadow:0 14px 22px -10px rgba(0,0,0,.18);
  position:relative;
  overflow:hidden;
}
.loan-hero:before{
  content:"";
  position:absolute;
  inset:-40% -20%;
  background:radial-gradient(closest-side,rgba(255,255,255,.12),transparent 60%);
}
.loan-title{
  display:flex;
  gap:.75rem;
  align-items:center;
}
.loan-icon{
  width:42px;height:42px;
  border-radius:9999px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
}
.loan-icon svg{width:20px;height:20px;color:#fff;}
.loan-h1{
  margin:0;
  font-size:clamp(1.2rem,2.2vw,1.7rem);
  font-weight:950;
}
.loan-sub{
  margin-top:.25rem;
  color:#d1fae5;
  font-weight:800;
  font-size:.92rem;
}

/* ---------- CARD ---------- */
.loan-card{
  margin-top:1rem;
  background:#fff;
  border-radius:1.25rem;
  padding:1.25rem;
  box-shadow:0 14px 22px -10px rgba(0,0,0,.18);
  border:1px solid rgba(4,120,87,.1);
}

.loan-section{
  display:flex;
  align-items:center;
  gap:.5rem;
  margin-bottom:.9rem;
  color:#047857;
  font-weight:950;
}
.loan-section svg{width:18px;height:18px;color:#059669;}

/* ---------- GRID ---------- */
.loan-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:.85rem;
}
.loan-field{
  display:flex;
  flex-direction:column;
  gap:.35rem;
}
.loan-label{
  font-size:.78rem;
  color:#059669;
  font-weight:900;
}

/* ---------- INPUTS ---------- */
.loan-input,
.loan-select,
.loan-textarea{
  width:100%;
  background:#f0fdf4;
  border-radius:.65rem;
  padding:.62rem .75rem;
  border:2px solid transparent;
  outline:none;
  font-size:1rem;
  font-weight:850;
}
.loan-textarea{min-height:90px;resize:vertical;}
.loan-input:focus,
.loan-select:focus,
.loan-textarea:focus{
  border-color:#34d399;
  box-shadow:0 0 0 3px rgba(52,211,153,.12);
  background:#ecfdf5;
}

/* ---------- GRID SPANS ---------- */
.col-3{grid-column:span 3;}
.col-4{grid-column:span 4;}
.col-6{grid-column:span 6;}
.col-9{grid-column:span 9;}
.col-12{grid-column:span 12;}

/* ---------- BUTTON ---------- */
.loan-footer{
  display:flex;
  justify-content:flex-end;
  margin-top:1rem;
}
.loan-btn{
  background:linear-gradient(to right,#059669,#10b981);
  color:#fff;
  padding:.7rem 1.2rem;
  border:none;
  border-radius:9999px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}
.loan-btn:hover{transform:translateY(-1px);}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){
  .col-3,.col-4,.col-6,.col-9{grid-column:span 12;}
  .loan-card{padding:1rem;}
}
</style>

<div class="loan-wrap">

  <!-- HERO -->
  <div class="loan-hero">
    <div class="loan-title">
      <div class="loan-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 7h18M5 7v10a2 2 0 002 2h10a2 2 0 002-2V7" stroke="currentColor" stroke-width="2"/>
          <path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <div class="loan-h1">PG Loan Details</div>
        <div class="loan-sub">Producer Group: {{ pg.name }}</div>
      </div>
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="loan-card">
    <div class="loan-section">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2"/>
      </svg>
      Loan Information
    </div>

    <form method="POST">
      <div class="loan-grid">

        <div class="loan-field col-3">
          <label class="loan-label">Business Plan Submitted?</label>
          <select class="loan-select" name="business_plan_submitted">
            <option value="no" {% if loan and not loan.business_plan_submitted %}selected{% endif %}>No</option>
            <option value="yes" {% if loan and loan.business_plan_submitted %}selected{% endif %}>Yes</option>
          </select>
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Business Plan Date</label>
          <input type="date" class="loan-input" name="business_plan_date"
                 value="{{ loan.business_plan_date if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Estimated Amount</label>
          <input type="number" step="0.01" class="loan-input" name="estimated_amount"
                 value="{{ loan.estimated_amount if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Sanction Amount</label>
          <input type="number" step="0.01" class="loan-input" name="sanction_amount"
                 value="{{ loan.sanction_amount if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Status</label>
          <input type="text" class="loan-input" name="status"
                 value="{{ loan.status if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Rate of Interest (%)</label>
          <input type="number" step="0.01" class="loan-input" name="roi"
                 value="{{ loan.roi if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Tenure (months)</label>
          <input type="number" class="loan-input" name="tenure_months"
                 value="{{ loan.tenure_months if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Moratorium Period</label>
          <input type="number" class="loan-input" name="moratorium_period"
                 value="{{ loan.moratorium_period if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Principal Repaid</label>
          <input type="number" step="0.01" class="loan-input" name="principal_repaid"
                 value="{{ loan.principal_repaid if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Interest Paid</label>
          <input type="number" step="0.01" class="loan-input" name="interest_paid"
                 value="{{ loan.interest_paid if loan else '' }}">
        </div>

        <div class="loan-field col-3">
          <label class="loan-label">Total Utilized Loan</label>
          <input type="number" step="0.01" class="loan-input" name="total_utilized_loan_amount"
                 value="{{ loan.total_utilized_loan_amount if loan else '' }}">
        </div>

        <div class="loan-field col-9">
          <label class="loan-label">Reason if Discontinued</label>
          <textarea class="loan-textarea" name="reason_discontinued">{{ loan.reason_discontinued if loan else '' }}</textarea>
        </div>

        <div class="col-12 loan-footer">
          <button class="loan-btn" type="submit">Save</button>
        </div>

      </div>
    </form>
  </div>

</div>

{% endblock %}
