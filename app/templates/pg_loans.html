{% extends "base.html" %}
{% block content %}

<style>


.pl-wrap{
  width: 100%;
  padding: clamp(12px, 2.2vw, 22px);
  --ink:#0f172a;
  --muted:#64748b;
  --line: rgba(15,23,42,.18);
  --line2: rgba(15,23,42,.12);
  --paper:#ffffff;
  --soft:#f7faf9;
  --accent:#0b4d3a;
  color: var(--ink);
}
.pl-wrap *{ box-sizing:border-box; }

.pl-sheet{
  max-width:1100px;
  margin:0 auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 18px 34px -26px rgba(15,23,42,.35);
}

/* header (ledger-like) */
.pl-head{
  padding: 14px 16px 12px;
  background:
    radial-gradient(circle at 15% 20%, rgba(11,77,58,.10), transparent 55%),
    linear-gradient(135deg, rgba(240,253,244,.9), rgba(255,255,255,.92));
  border-bottom: 1.5px solid var(--line2);
  position: relative;
}
.pl-title{
  margin: 0;
  font-weight: 950;
  font-size: 18px;
  text-align: center;
  letter-spacing: .2px;
}
.pl-sub{
  margin-top: 6px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap: 10px;
  color: rgba(15,23,42,.72);
  font-weight: 900;
  font-size: 12px;
}
.pl-badge{
  display:inline-flex;
  align-items:center;
  gap: 8px;
  padding: 7px 12px;
  border: 1px solid rgba(15,23,42,.14);
  border-radius: 999px;
  background: rgba(255,255,255,.75);
}
.pl-badge svg{ width:14px; height:14px; color: rgba(11,77,58,.95); }

/* top fields (ledger-like) */
.pl-topfields{
  padding: 10px 16px 14px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px 14px;
  border-bottom: 1.5px solid var(--line2);
  background: rgba(255,255,255,.92);
}
.pl-field{
  display:flex;
  align-items:center;
  gap: 10px;
  min-width: 0;
}
.pl-label{
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
  color: var(--ink);
}
.pl-input{
  flex: 1;
  border: 1px solid rgba(15,23,42,.16);
  border-radius: 12px;
  padding: 8px 10px;
  background: rgba(247,250,249,.75);
  font-weight: 800;
  font-size: 12px;
  outline: none;
}
.pl-input:focus{
  border-color: rgba(11,77,58,.40);
  box-shadow: 0 0 0 3px rgba(11,77,58,.10);
  background: #fff;
}
.pl-input[readonly]{
  background: transparent;
  border-color: rgba(15,23,42,.12);
}

/* section label row like ledger controls */
.pl-controls{
  padding: 10px 16px;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1.5px solid var(--line2);
  background: rgba(255,255,255,.92);
  flex-wrap: wrap;
}
.pl-section{
  display:flex;
  align-items:center;
  gap: 10px;
  color: rgba(11,77,58,.95);
  font-weight: 950;
  font-size: 12px;
}
.pl-section svg{ width:16px; height:16px; }

/* form grid */
.pl-form{
  padding: 14px 16px 16px;
  background: #fff;
}
.pl-grid{
  display:grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 10px 14px;
}
.pl-col-3{ grid-column: span 3; }
.pl-col-4{ grid-column: span 4; }
.pl-col-6{ grid-column: span 6; }
.pl-col-9{ grid-column: span 9; }
.pl-col-12{ grid-column: span 12; }

.pl-fwrap{
  display:flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.pl-flabel{
  font-size: 12px;
  font-weight: 900;
  color: rgba(15,23,42,.72);
}

/* inputs styled like ledger */
.pl-control,
.pl-select,
.pl-textarea{
  width:100%;
  border: 1px solid rgba(15,23,42,.16);
  border-radius: 12px;
  padding: 10px 10px;
  background: rgba(247,250,249,.75);
  font-weight: 800;
  font-size: 12px;
  outline: none;
}
.pl-textarea{ min-height: 96px; resize: vertical; }
.pl-control:focus,
.pl-select:focus,
.pl-textarea:focus{
  border-color: rgba(11,77,58,.40);
  box-shadow: 0 0 0 3px rgba(11,77,58,.10);
  background: #fff;
}
.pl-control.num{ text-align:right; font-variant-numeric: tabular-nums; }
.pl-select{ cursor:pointer; }

/* footer actions (ledger button style) */
.pl-footer{
  padding: 12px 16px 16px;
  display:flex;
  justify-content:flex-end;
  gap: 10px;
  border-top: 1.5px solid var(--line2);
  background: rgba(255,255,255,.94);
}
.pl-btn{
  border: 1px solid rgba(16,185,129,.35);
  background: rgba(16,185,129,.12);
  color:#0b4d3a;
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 950;
  font-size: 12px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
  display:inline-flex;
  align-items:center;
  gap: 8px;
  user-select: none;
  white-space: nowrap;
}
.pl-btn:hover{
  transform: translateY(-1px);
  background: rgba(16,185,129,.16);
  box-shadow: 0 16px 22px -18px rgba(15,23,42,.25);
}
.pl-btn svg{ width:14px; height:14px; }

/* responsive like ledger */
@media (max-width: 720px){
  .pl-topfields{ grid-template-columns: 1fr; }
  .pl-col-3,.pl-col-4,.pl-col-6,.pl-col-9{ grid-column: span 12; }
}
</style>

<div class="pl-wrap">
  <div class="pl-sheet">

    <!-- HEADER -->
    <div class="pl-head">
      <h2 class="pl-title">PG Loan Details</h2>
      <div class="pl-sub">
        <span class="pl-badge">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 7h18M5 7v10a2 2 0 002 2h10a2 2 0 002-2V7" stroke="currentColor" stroke-width="2"/>
            <path d="M9 12h6M9 16h4" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Producer Group: {{ pg.name }}</span>
        </span>
      </div>
    </div>

    <!-- TOP FIELD (keeps existing data, just styled) -->
    <div class="pl-topfields">
      <div class="pl-field">
        <div class="pl-label">Producer Group</div>
        <input class="pl-input" type="text" value="{{ pg.name }}" readonly>
      </div>
    </div>

    <!-- SECTION BAR -->
    <div class="pl-controls">
      <div class="pl-section">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2"/>
        </svg>
        Loan Information
      </div>
      <!-- intentionally empty right side to match ledger clean bar -->
      <div style="font-weight:950; font-size:12px; color:rgba(15,23,42,.55);"></div>
    </div>

    <!-- FORM (NO DATA CHANGES) -->
    <form method="POST">
      <div class="pl-form">
        <div class="pl-grid">

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Business Plan Submitted?</label>
            <select class="pl-select" name="business_plan_submitted">
              <option value="no" {% if loan and not loan.business_plan_submitted %}selected{% endif %}>No</option>
              <option value="yes" {% if loan and loan.business_plan_submitted %}selected{% endif %}>Yes</option>
            </select>
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Business Plan Date</label>
            <input type="date" class="pl-control" name="business_plan_date"
                   value="{{ loan.business_plan_date if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Estimated Amount</label>
            <input type="number" step="0.01" class="pl-control num" name="estimated_amount"
                   value="{{ loan.estimated_amount if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Sanction Amount</label>
            <input type="number" step="0.01" class="pl-control num" name="sanction_amount"
                   value="{{ loan.sanction_amount if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Status</label>
            <input type="text" class="pl-control" name="status"
                   value="{{ loan.status if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Rate of Interest (%)</label>
            <input type="number" step="0.01" class="pl-control num" name="roi"
                   value="{{ loan.roi if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Tenure (months)</label>
            <input type="number" class="pl-control num" name="tenure_months"
                   value="{{ loan.tenure_months if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Moratorium Period</label>
            <input type="number" class="pl-control num" name="moratorium_period"
                   value="{{ loan.moratorium_period if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Principal Repaid</label>
            <input type="number" step="0.01" class="pl-control num" name="principal_repaid"
                   value="{{ loan.principal_repaid if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Interest Paid</label>
            <input type="number" step="0.01" class="pl-control num" name="interest_paid"
                   value="{{ loan.interest_paid if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-3">
            <label class="pl-flabel">Total Utilized Loan</label>
            <input type="number" step="0.01" class="pl-control num" name="total_utilized_loan_amount"
                   value="{{ loan.total_utilized_loan_amount if loan else '' }}">
          </div>

          <div class="pl-fwrap pl-col-9">
            <label class="pl-flabel">Reason if Discontinued</label>
            <textarea class="pl-textarea" name="reason_discontinued">{{ loan.reason_discontinued if loan else '' }}</textarea>
          </div>

        </div>
      </div>

      <div class="pl-footer">
        <button class="pl-btn" type="submit">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" stroke="currentColor" stroke-width="2"/>
            <polyline points="17 21 17 13 7 13 7 21" stroke="currentColor" stroke-width="2"/>
            <polyline points="7 3 7 8 15 8" stroke="currentColor" stroke-width="2"/>
          </svg>
          Save
        </button>
      </div>
    </form>

  </div>
</div>

{% endblock %}
