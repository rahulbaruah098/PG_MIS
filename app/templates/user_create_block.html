{% extends "base.html" %}
{% block content %}
<h4>Create Block Admin</h4>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Block</label>
        <select name="block_id" class="form-select" required>
          {% for b in blocks %}
            <option value="{{ b._id|string }}">{{ b.name }}</option>
          {% endfor %}
        </select>
        <div class="form-text">Blocks must exist in Master Data.</div>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Create Block Admin</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
